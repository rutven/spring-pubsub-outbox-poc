services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: poc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "poc"]
      interval: 2s
      retries: 30

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=poc-local
    ports:
      - "127.0.0.1:8085:8085"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8085"]
      interval: 2s
      retries: 30

  pubsub-init:
    image: curlimages/curl:8.17.0
    depends_on:
      pubsub:
        condition: service_healthy
    environment:
      PUBSUB_HOST: pubsub:8085
    volumes:
      - ./docker/pubsub/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]

  lgtm:
    # OTel Collector + Tempo + Loki + Prometheus + Grafana (admin/admin)
    image: grafana/otel-lgtm:latest
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
