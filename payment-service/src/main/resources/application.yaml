spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/poc?currentSchema=payments
    username: payment_svc
    password: payment_svc
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: payments
  liquibase:
    default-schema: payments
  cloud:
    gcp:
      project-id: poc-local
      pubsub:
        emulator-host: ${PUBSUB_EMULATOR_HOST:localhost:8085}
        publisher:
          enable-message-ordering: true
          retry:
            # A publish fails within 25s, before the relay's 30s wait gives up, and shutdown stays bounded.
            total-timeout-seconds: 25
            initial-rpc-timeout-seconds: 5
            max-rpc-timeout-seconds: 10

server:
  port: 8082

management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  otlp:
    metrics:
      export:
        url: ${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 10s
  endpoints:
    web:
      exposure:
        include: health,info,metrics
