# Cloud Run: Cloud SQL over the Java connector with IAM auth, real Pub/Sub, OTLP to the collector sidecar on localhost.
spring:
  datasource:
    url: jdbc:postgresql:///poc?cloudSqlInstance=${CLOUD_SQL_INSTANCE}&socketFactory=com.google.cloud.sql.postgres.SocketFactory&enableIamAuth=true&sslmode=disable&currentSchema=payments
    username: ${DB_IAM_USER}
    password: ""
    hikari:
      maximum-pool-size: 4 # db-f1-micro allows ~25 connections; 2 services x 2 instances x overlap during rollouts
  cloud:
    gcp:
      pubsub:
        emulator-host: "false"

management:
  logging:
    export:
      otlp:
        enabled: false # stdout -> Cloud Logging
  opentelemetry:
    resource-attributes:
      deployment.environment.name: gcp
